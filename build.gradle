plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'edu.umich.eecs.april.apriltag'
    compileSdk 34

    defaultConfig {
        applicationId "edu.umich.eecs.april.apriltag"
        minSdk 21
        targetSdk 34
        versionCode 13
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}

dependencies {
    def camerax_version = "1.4.1"

    // Align all Kotlin stdlib modules to one version. A transitive dep pulls
    // the legacy kotlin-stdlib-jdk7/jdk8 (1.6.21) whose classes were merged into
    // kotlin-stdlib in 1.8+, causing duplicate-class build failures.
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.9.24")

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.preference:preference:1.2.1'

    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    testImplementation 'junit:junit:4.13.2'
}
